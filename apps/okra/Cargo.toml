[package]
name = "okra"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "okra headless CLI: one daemon-shaped agent, NDJSON events, offline demo sampler"

[[bin]]
name = "okra"
path = "src/main.rs"

[dependencies]
okra-protocol = { workspace = true }
okra-kernel = { workspace = true }
okra-tools = { workspace = true }
okra-policy = { workspace = true }
okra-agent-core = { workspace = true }
okra-compaction = { workspace = true }
okra-computer = { workspace = true }
okra-memory = { workspace = true }
okra-providers = { workspace = true }
okra-gateway = { workspace = true }
okra-host = { workspace = true }
okra-workflow = { workspace = true }
rhai = { workspace = true }
crossterm = { workspace = true }
okra-tui = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
base64 = "0.23"

[dev-dependencies]
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
okra-kernel = { workspace = true }
okra-tui = { workspace = true }
tempfile = { workspace = true }

# windows platform shims (the restricted-token confined launch; pinned
# exact, matching okra-host)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
] }
