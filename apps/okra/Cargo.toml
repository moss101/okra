[package]
name = "okra"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "okra headless CLI: one daemon-shaped agent, NDJSON events, offline demo sampler"

[[bin]]
name = "okra"
path = "src/main.rs"

[dependencies]
okra-protocol = { workspace = true }
okra-kernel = { workspace = true }
okra-tools = { workspace = true }
okra-policy = { workspace = true }
okra-agent-core = { workspace = true }
okra-compaction = { workspace = true }
okra-computer = { workspace = true }
okra-memory = { workspace = true }
okra-providers = { workspace = true }
okra-gateway = { workspace = true }
okra-host = { workspace = true }
okra-workflow = { workspace = true }
rhai = { workspace = true }
crossterm = { workspace = true }
okra-tui = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
base64 = "0.23"

[dev-dependencies]
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
okra-kernel = { workspace = true }
okra-tui = { workspace = true }
tempfile = { workspace = true }
