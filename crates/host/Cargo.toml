[package]
name = "okra-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host services: notifications policy, safe file service, fsutil, automation guard"

[dependencies]
okra-kernel = { workspace = true }
okra-policy = { workspace = true }
okra-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
portable-pty = { workspace = true }
sha2 = { workspace = true }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
regex = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
flate2 = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true }
aes-gcm = { workspace = true }
rcgen = "0.14.10"

# windows platform shims (the port-doc second pass: ACL mapping for
# safe-read, Job Objects tree-kill). Pinned exact per the nono decision
# pattern; unix builds never see it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
