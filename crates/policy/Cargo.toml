[package]
name = "okra-policy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Fail-closed approvals, arg-hash grants, confine(argv), sandbox profiles, permission lattice"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

# the kernel-sandbox backend (Landlock/Seatbelt) — unix-only by upstream
# contract; windows builds the honest-unavailable stub in nono_backend.rs
[target.'cfg(unix)'.dependencies]
nono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# nono is a main dependency (nono_backend); nothing extra needed here
